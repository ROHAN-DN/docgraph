[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docgraph"
version = "0.1.0"
description = "Knowledge graph and data lineage suggestions from functional documentation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic-settings>=2.6,<3",
  "neo4j>=5.26,<6",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "typer>=0.15,<1",
  "openai>=1.55,<2",
  "anthropic>=0.40,<1",
  "matplotlib>=3.9,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "streamlit>=1.40,<2",
]

[project.scripts]
docgraph = "docgraph.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/docgraph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Neo4j service"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
